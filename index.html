<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f42c1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🏭 Windoora - نظام حساب الشبابيك والأبواب (ريال)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00B894;
            --primary-light: #00CEC9;
            --primary-dark: #00A085;
            --secondary: #6C5CE7;
            --secondary-light: #A29BFE;
            --secondary-dark: #5B4CD4;
            --accent: #FD79A8;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --dark: #1a1a2e;
            --dark-light: #16213e;
            --card: #FFFFFF;
            --card-dark: #2d2d44;
            --text-dark: #1E293B;
            --text-light: #f8f9fa;
            --text-medium: #64748B;
            --text-muted: #94A3B8;
            --border: #e2e8f0;
            --border-dark: #3d3d5c;
            --sidebar-width: 280px;
            --bg-main: #f0f4ff;
            --bg-dark: #1a1a2e;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --font-ar: 'Cairo', sans-serif;
            --font-en: 'Poppins', sans-serif;
        }
        
        [data-theme="dark"] {
            --card: #2d2d44;
            --bg-main: #1a1a2e;
            --text-dark: #f8f9fa;
            --text-medium: #a0aec0;
            --border: #3d3d5c;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        [dir="rtl"] { font-family: var(--font-ar); }
        [dir="ltr"] { font-family: var(--font-en); }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: var(--font-ar);
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .floating-btns {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1002;
        }
        
        .float-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            color: white;
            border: none;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .theme-toggle { background: var(--primary); }
        .lang-toggle { background: var(--secondary); font-size: 0.9em; }
        .float-btn:hover { transform: scale(1.1); }
        .float-btn:active { transform: scale(0.95); }
        
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px 16px;
            z-index: 1000;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        
        [dir="ltr"] .sidebar { right: auto; left: 0; }
        
        .sidebar-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        
        .sidebar-logo { font-size: 2.5em; margin-bottom: 8px; }
        
        .sidebar-title {
            color: white;
            font-size: 1.5em;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .sidebar-subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 0.8em;
            margin-top: 4px;
        }
        
        .currency-badge {
            color: #fff;
            font-size: 0.85em;
            margin-top: 10px;
            font-weight: 700;
            padding: 8px 16px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border-radius: var(--radius-sm);
            display: inline-block;
        }
        
        .sidebar-credit {
            color: #fff;
            font-size: 0.9em;
            margin-top: 14px;
            font-weight: 700;
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-sm);
            display: inline-block;
            box-shadow: 0 4px 15px rgba(244, 44, 28, 0.3);
        }
        
        .nav-section { margin-bottom: 16px; }
        
        .nav-section-title {
            color: rgba(255,255,255,0.4);
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-right: 12px;
        }
        
        [dir="ltr"] .nav-section-title { padding-right: 0; padding-left: 12px; }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.95em;
        }
        
        .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 4px 15px rgba(244, 44, 28, 0.4);
        }
        
        .nav-item .nav-icon { font-size: 1.2em; width: 26px; text-align: center; }
        
        .sidebar-settings-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        
        .sidebar-settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(13, 110, 253, 0.4);
        }
        
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.4em;
            cursor: pointer;
            z-index: 1001;
            box-shadow: var(--shadow-lg);
            align-items: center;
            justify-content: center;
        }
        
        [dir="ltr"] .mobile-menu-btn { right: auto; left: 16px; }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .main-content {
            margin-right: var(--sidebar-width);
            padding: 20px;
            min-height: 100vh;
            transition: margin 0.3s ease;
        }
        
        [dir="ltr"] .main-content { margin-right: 0; margin-left: var(--sidebar-width); }
        
        .system-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .system-btn {
            padding: 16px 32px;
            border: 3px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--card);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 150px;
            font-family: inherit;
        }
        
        .system-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
        
        .system-btn.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }
        
        .system-btn .system-icon { font-size: 2em; margin-bottom: 6px; }
        .system-btn .system-name { font-size: 1.1em; font-weight: 700; }
        
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .bento-card {
            background: var(--card);
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .bento-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .bento-card.span-2 { grid-column: span 2; }
        .bento-card.span-full { grid-column: 1 / -1; }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }
        
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }
        
        .card-icon.purple { background: rgba(244, 44, 28, 0.15); color: var(--primary); }
        .card-icon.green { background: #e0fff4; color: #00b894; }
        .card-icon.blue { background: rgba(13, 110, 253, 0.15); color: var(--secondary); }
        .card-icon.orange { background: #fff3e0; color: #e17055; }
        .card-icon.pink { background: #fff0f6; color: #FD79A8; }
        .card-icon.cyan { background: #e0f7fa; color: #00838f; }
        
        [data-theme="dark"] .card-icon { opacity: 0.9; }
        
        .card-title { font-size: 1.1em; font-weight: 700; }
        
        .price-badge-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            color: white;
            text-align: center;
            padding: 28px 20px;
            position: relative;
            overflow: hidden;
        }
        
        .price-badge-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(244, 44, 28, 0.2) 0%, transparent 60%);
            animation: pricePulse 4s ease-in-out infinite;
        }
        
        @keyframes pricePulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .price-badge-content { position: relative; z-index: 2; }
        .price-badge-icon { font-size: 2.5em; margin-bottom: 12px; opacity: 0.9; }
        .price-badge-label { font-size: 0.95em; opacity: 0.8; margin-bottom: 6px; }
        
        .price-badge-value {
            font-size: 2.4em;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        
        .price-badge-currency { font-size: 1.3em; opacity: 0.9; color: var(--secondary); }
        
        .price-badge-secondary {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .price-per-meter {
            font-size: 1.1em;
            color: var(--warning);
            margin-bottom: 8px;
            padding: 8px 16px;
            background: rgba(253,203,110,0.15);
            border-radius: 8px;
            display: inline-block;
        }
        
        .price-badge-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
            font-size: 0.8em;
            opacity: 0.7;
            flex-wrap: wrap;
        }
        
        .input-group { margin-bottom: 14px; }
        
        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85em;
        }
        
        .input-group .field-icon { font-size: 1em; }
        
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            font-weight: 500;
            color: var(--text-dark);
            background: var(--card);
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }
        
        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(244, 44, 28, 0.1);
        }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .checkbox-group:hover { border-color: var(--primary); }
        
        .checkbox-group.checked {
            border-color: var(--primary);
            background: rgba(244, 44, 28, 0.1);
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        
        .checkbox-group label { cursor: pointer; font-weight: 600; flex: 1; font-size: 0.9em; }
        
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .radio-item {
            flex: 1;
            min-width: 80px;
            padding: 12px 14px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
        }
        
        .radio-item:hover { border-color: var(--primary); }
        
        .radio-item.selected {
            border-color: var(--primary);
            background: rgba(244, 44, 28, 0.1);
            color: var(--primary);
        }
        
        .radio-item input { display: none; }
        
        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1em;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            width: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244, 44, 28, 0.4);
        }
        
        .btn-success { background: linear-gradient(135deg, #00b894, #00CEC9); color: white; }
        .btn-warning { background: linear-gradient(135deg, #e17055, #FD79A8); color: white; }
        .btn-dark { background: linear-gradient(135deg, #2D3436, #636e72); color: white; }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }
        
        .result-box {
            background: var(--card);
            padding: 14px;
            border-radius: var(--radius-sm);
            border-right: 4px solid var(--primary);
            box-shadow: var(--shadow-sm);
        }
        
        [dir="ltr"] .result-box { border-right: none; border-left: 4px solid var(--primary); }
        
        .result-box h3 {
            font-size: 0.9em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
        }
        
        .result-box.green { border-color: var(--success); }
        .result-box.green h3 { color: var(--success); }
        .result-box.orange { border-color: var(--warning); }
        .result-box.orange h3 { color: #d68910; }
        .result-box.blue { border-color: var(--secondary); }
        .result-box.blue h3 { color: var(--secondary); }
        .result-box.cyan { border-color: #00CEC9; }
        .result-box.cyan h3 { color: #00838f; }
        .result-box.pink { border-color: var(--accent); }
        .result-box.pink h3 { color: #d63384; }
        
        [dir="ltr"] .result-box.green,
        [dir="ltr"] .result-box.orange,
        [dir="ltr"] .result-box.blue,
        [dir="ltr"] .result-box.cyan,
        [dir="ltr"] .result-box.pink { border-right: none; }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85em;
        }
        
        .result-item:last-child { border-bottom: none; }
        .result-label { color: var(--text-medium); }
        .result-value { font-weight: 700; }
        
        .summary-total {
            background: rgba(244, 44, 28, 0.1);
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 700;
            font-size: 0.9em;
            color: var(--primary);
        }
        
        .summary-total.green { background: rgba(0,184,148,0.1); color: var(--success); }
        .summary-total.orange { background: rgba(253,203,110,0.2); color: #d68910; }
        .summary-total.pink { background: rgba(253,121,168,0.15); color: #d63384; }
        
        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px;
            overflow-y: auto;
        }
        
        .settings-panel.show { display: flex; }
        
        .settings-container {
            background: var(--card);
            border-radius: var(--radius-lg);
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }
        
        .settings-header {
            background: linear-gradient(135deg, #1a1a2e, #2d2d44);
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .settings-header h2 { font-size: 1.3em; display: flex; align-items: center; gap: 10px; }
        
        .settings-close {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .settings-close:hover { background: rgba(255,255,255,0.2); }
        
        .settings-body { padding: 24px; }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .settings-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        
        .settings-tab {
            padding: 12px 24px;
            border: none;
            background: var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.95em;
        }
        
        .settings-tab:hover { background: #d0d0d0; }
        .settings-tab.active { background: var(--primary); color: white; }
        
        .settings-tab-content { display: none; }
        .settings-tab-content.active { display: block; }
        
        .price-section {
            background: rgba(244, 44, 28, 0.05);
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        
        .price-section h4 {
            font-size: 0.95em;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .price-section.ps-kompen { background: rgba(0,184,148,0.08); }
        .price-section.ps-kompen h4 { color: #276749; }
        .price-section.ps-kompen-color { background: rgba(255,107,107,0.08); }
        .price-section.ps-kompen-color h4 { color: #c53030; }
        .price-section.ps-craft { background: rgba(13, 110, 253, 0.08); }
        .price-section.ps-craft h4 { color: var(--secondary); }
        .price-section.ps-craft-color { background: rgba(107,70,193,0.08); }
        .price-section.ps-craft-color h4 { color: #6b46c1; }
        .price-section.ps-accessories { background: rgba(253,203,110,0.15); }
        .price-section.ps-accessories h4 { color: #975a16; }
        .price-section.ps-espagnolette { background: rgba(162,155,254,0.15); }
        .price-section.ps-espagnolette h4 { color: #6b46c1; }
        .price-section.ps-sliding { background: rgba(0,206,201,0.1); }
        .price-section.ps-sliding h4 { color: #00838f; }
        
        .settings-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 20px 24px;
            background: var(--border);
            border-top: 1px solid var(--border);
        }
        
        .settings-buttons .btn { flex: 1; min-width: 130px; }
        
        .lock-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26,26,46,0.9);
            backdrop-filter: blur(10px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .lock-overlay.show { display: flex; }
        
        .lock-box {
            background: var(--card);
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-lg);
            max-width: 380px;
            width: 100%;
        }
        
        .lock-box .lock-icon { font-size: 3em; margin-bottom: 14px; }
        .lock-box h3 { margin-bottom: 8px; font-size: 1.3em; }
        .lock-box p { color: var(--text-medium); margin-bottom: 20px; font-size: 0.9em; }
        
        .lock-box input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 22px;
            text-align: center;
            margin-bottom: 14px;
            letter-spacing: 8px;
            font-family: inherit;
        }
        
        .lock-box input:focus { border-color: var(--primary); outline: none; }
        .lock-box .btn { width: 100%; margin-bottom: 8px; }
        .lock-box .error-msg { color: #e74c3c; font-weight: 700; margin-top: 10px; display: none; font-size: 0.9em; }
        
        .save-notification {
            position: fixed;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00b894, #00CEC9);
            color: white;
            padding: 16px 36px;
            border-radius: var(--radius-md);
            z-index: 9999;
            font-size: 1em;
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            transition: top 0.4s ease;
        }
        
        .save-notification.show { top: 24px; }
        
        @media (max-width: 1024px) {
            .bento-card.span-2 { grid-column: span 1; }
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(100%); width: 85%; max-width: 300px; }
            [dir="ltr"] .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            .mobile-menu-btn { display: flex; }
            
            .main-content {
                margin-right: 0 !important;
                margin-left: 0 !important;
                padding: 70px 12px 160px;
            }
            
            .bento-grid { grid-template-columns: 1fr; gap: 12px; }
            .bento-card.span-full, .bento-card.span-2 { grid-column: span 1; }
            .input-row { grid-template-columns: 1fr; }
            .price-badge-value { font-size: 2em; }
            .system-selector { gap: 8px; }
            .system-btn { padding: 14px 20px; min-width: 120px; flex: 1; }
            .system-btn .system-icon { font-size: 1.6em; }
            .system-btn .system-name { font-size: 0.95em; }
            .results-grid { grid-template-columns: 1fr; }
            
            .floating-btns { bottom: 16px; left: 16px; }
            .float-btn { width: 50px; height: 50px; font-size: 1.2em; }
            .lang-toggle { font-size: 0.8em; }
            
            .settings-grid { grid-template-columns: 1fr; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--border); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .hinged-section, .sliding-section { display: none; }
        .hinged-section.active, .sliding-section.active { display: block; }
        
        @media print {
            .sidebar, .mobile-menu-btn, .floating-btns, .btn { display: none !important; }
            .main-content { margin: 0 !important; padding: 10px; }
            .bento-card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>

        }
        
        function applyLanguage() {
            const html = document.documentElement;
            const langBtn = document.querySelector('.lang-toggle');
            if (currentLang === 'ar') {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
                langBtn.textContent = 'EN';
            } else {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
                langBtn.textContent = 'ع';
            }
            document.querySelectorAll('[data-ar][data-en]').forEach(el => {
                el.textContent = currentLang === 'ar' ? el.dataset.ar : el.dataset.en;

            if (currentSystem === 'hinged') calculateHinged();
            else calculateSliding();
        }
        
        function loadLanguage() {
            currentLang = localStorage.getItem('windooraLangSAR') || 'ar';
            applyLanguage();
        }
        
        // ==================== دوال الثيم ====================
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle');
            if (body.dataset.theme === 'dark') {
                body.dataset.theme = 'light';
                btn.textContent = '🌙';
                localStorage.setItem('windooraThemeSAR', 'light');
            } else {
                body.dataset.theme = 'dark';
                btn.textContent = '☀️';
                localStorage.setItem('windooraThemeSAR', 'dark');
            }
            saveFormData();
        }

            document.getElementById('slidingSection').classList.remove('active');
            document.getElementById('hingedBtn').classList.remove('active');
            document.getElementById('slidingBtn').classList.remove('active');
            document.getElementById('navHinged').classList.remove('active');
            document.getElementById('navSliding').classList.remove('active');

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }
        
        // ==================== دوال الخيارات ====================
        function toggleCheckbox(el, inputId) {

            calculateSliding();

        function toggleRollerType() {

        }
        
        // ==================== دوال الإعدادات ====================
        function toggleSettings() {
            document.getElementById('lockOverlay').classList.add('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
            document.getElementById('errorMsg').style.display = 'none';
        }
        
        function checkPassword() {
            if (document.getElementById('passwordInput').value === getPassword()) {
                closeLock();
                document.getElementById('settingsPanel').classList.add('show');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.querySelector('.lock-box').style.animation = 'shake 0.5s';

            }
        }
        
        function closeLock() { document.getElementById('lockOverlay').classList.remove('show'); }
        function closeSettings() { document.getElementById('settingsPanel').classList.remove('show'); }
        
        function switchSettingsTab(tab, btn) {
            document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.settings-tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(tab + 'Settings').classList.add('active');
        }
        
        function changePassword() {
            const c = prompt(getText('كلمة السر الحالية:', 'Current password:'));
            if (c !== getPassword()) { alert(getText('❌ خطأ!', '❌ Wrong!')); return; }
            const n = prompt(getText('الجديدة:', 'New:'));
            if (n && n.trim()) {
                const cf = prompt(getText('تأكيد:', 'Confirm:'));
                if (n === cf) { localStorage.setItem('windooraPasswordSAR', n); alert(getText('✅ تم!', '✅ Done!')); }
                else { alert(getText('❌ غير متطابقة!', '❌ Not match!')); }
            }
        }
        
        // ==================== دوال الحفظ ====================
        function savePrices() {
            const inputs = document.querySelectorAll('.settings-body input');
            const p = {};
            inputs.forEach(i => { if (i.id) p[i.id] = i.value; });
            localStorage.setItem('windooraPricesSAR', JSON.stringify(p));
            const n = document.getElementById('saveNotification');
            n.querySelector('span').textContent = getText('تم الحفظ بنجاح', 'Saved');

            if (currentSystem === 'hinged') calculateHinged();
            else calculateSliding();

        function loadPrices() {

            if (s) {
                const p = JSON.parse(s);
                Object.keys(p).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = p[id];

            }

                document.getElementById('hingedFixedLeft').value = d.hinged.fixedLeft || 0;

            });
            
            switchSystem(currentSystem);

        // ==================== حساب المفصلي ====================
        function calculateHinged() {
            const width = getVal('hingedWidth'), height = getVal('hingedHeight');
            const color = document.getElementById('hingedColor').value;
            const frameType = document.getElementById('hingedFrameType').value;
            const windowType = document.getElementById('hingedWindowType').value;
            const opType = document.getElementById('hingedOperationType').value;
            const doorCount = parseInt(document.getElementById('hingedDoorCount').value);
            const fixedR = getVal('hingedFixedRight'), fixedL = getVal('hingedFixedLeft');
            const fixedT = getVal('hingedFixedTop'), fixedB = getVal('hingedFixedBottom');
            
            const profile = HINGED_PROFILES[frameType];
            const isColored = color === 'colored';
            const colorSuffix = isColored ? 'C' : 'W';
            const isCraft = profile.system === 'craft';
            
            const framePrice = getVal('price' + frameType + colorSuffix);
            const sashPrice = isCraft ? getVal('priceSashCraft' + colorSuffix) : getVal('priceSash' + colorSuffix);
            const doorPrice = isCraft ? getVal('priceDoorCraft' + colorSuffix) : getVal('priceDoor' + colorSuffix);
            const sawasPrice = isCraft ? getVal('priceSawasCraft' + colorSuffix) : getVal('priceSawas' + colorSuffix);
            const teePrice = isCraft ? getVal('priceTeeCraft' + colorSuffix) : getVal('priceTee' + colorSuffix);
            const bakitaPrice = isCraft ? getVal('priceBakitaCraft' + colorSuffix) : getVal('priceBakita' + colorSuffix);
            const glassPrice = getVal('priceGlass');
            const wastePercent = getVal('wastePercent');
            const profitPerM2 = getVal('profitPerM2');
            const wasteFactor = 1 + (wastePercent / 100);
            
            const frameW = width + profile.frameAddition;
            const frameH = height + profile.frameAddition;
            const frameLM = ((frameW * 2) + (frameH * 2)) / 100;
            
            const openingW = width - (profile.frameDiscount * 2) - fixedR - fixedL;
            const openingH = height - (profile.frameDiscount * 2) - fixedT - fixedB;
            
            let sashW = (doorCount === 1 || windowType === 'باب') ? openingW + profile.overlap + profile.clearance : ((openingW + profile.overlap - profile.clearance) / 2) + profile.clearance;
            let sashH = openingH + profile.overlap + profile.clearance;
            let sashLM = ((sashW * 2 + sashH * 2) * doorCount) / 100;
            
            const glassDiscount = windowType === 'شباك' ? profile.glassDiscountWindow : profile.glassDiscountDoor;
            const glassW = sashW - glassDiscount;
            const glassH = sashH - glassDiscount;
            const glassArea = (glassW * glassH * doorCount) / 10000;
            
            const bakitaW = glassW + profile.bakitaAddition;
            const bakitaH = glassH + profile.bakitaAddition;
            const bakitaLM = (((bakitaW + bakitaH) * 2) * doorCount) / 100;
            
            let teeLM = (doorCount === 2 && windowType !== 'باب') ? (sashH - profile.teeDiscount) / 100 : 0;
            let teeH = teeLM > 0 ? sashH - profile.teeDiscount : 0;
            
            let sawasLM = 0, sawasDetails = [];
            if (fixedR > 0) { const v = height - (profile.frameDiscount * 2) - profile.sawasDiscount; sawasLM += v / 100; sawasDetails.push({name: getText('سؤاس يمين', 'Right Mullion'), val: v}); }
            if (fixedL > 0) { const v = height - (profile.frameDiscount * 2) - profile.sawasDiscount; sawasLM += v / 100; sawasDetails.push({name: getText('سؤاس شمال', 'Left Mullion'), val: v}); }
            if (fixedT > 0) { const v = width - (profile.frameDiscount * 2) - profile.sawasDiscount; sawasLM += v / 100; sawasDetails.push({name: getText('سؤاس علوي', 'Top Mullion'), val: v}); }
            if (fixedB > 0) { const v = width - (profile.frameDiscount * 2) - profile.sawasDiscount; sawasLM += v / 100; sawasDetails.push({name: getText('سؤاس سفلي', 'Bottom Mullion'), val: v}); }
            
            let fixedGlass = [], fixedBakita = [];
            if (fixedR > 0) { const gw = fixedR - 1, gh = height - (profile.frameDiscount * 2) - 1; fixedGlass.push({name: getText('زجاج ثابت يمين', 'Right Fixed Glass'), w: gw, h: gh}); fixedBakita.push({name: getText('باكته ثابت يمين', 'Right Fixed Bead'), w: gw + 1, h: gh + 1}); }
            if (fixedL > 0) { const gw = fixedL - 1, gh = height - (profile.frameDiscount * 2) - 1; fixedGlass.push({name: getText('زجاج ثابت شمال', 'Left Fixed Glass'), w: gw, h: gh}); fixedBakita.push({name: getText('باكته ثابت شمال', 'Left Fixed Bead'), w: gw + 1, h: gh + 1}); }
            if (fixedT > 0) { const gw = width - (profile.frameDiscount * 2) - 1, gh = fixedT - 1; fixedGlass.push({name: getText('زجاج ثابت علوي', 'Top Fixed Glass'), w: gw, h: gh}); fixedBakita.push({name: getText('باكته ثابت علوي', 'Top Fixed Bead'), w: gw + 1, h: gh + 1}); }
            if (fixedB > 0) { const gw = width - (profile.frameDiscount * 2) - 1, gh = fixedB - 1; fixedGlass.push({name: getText('زجاج ثابت سفلي', 'Bottom Fixed Glass'), w: gw, h: gh}); fixedBakita.push({name: getText('باكته ثابت سفلي', 'Bottom Fixed Bead'), w: gw + 1, h: gh + 1}); }
            
            let totalFixedGlassArea = 0; fixedGlass.forEach(g => totalFixedGlassArea += (g.w * g.h) / 10000);
            let totalFixedBakitaLM = 0; fixedBakita.forEach(b => totalFixedBakitaLM += ((b.w + b.h) * 2) / 100);
            const totalGlassArea = glassArea + totalFixedGlassArea;
            const totalBakitaLM = bakitaLM + totalFixedBakitaLM;
            
            const frameCost = frameLM * wasteFactor * framePrice;
            const sashCost = sashLM * wasteFactor * (windowType === 'باب' ? doorPrice : sashPrice);
            const teeCost = teeLM * wasteFactor * teePrice;
            const sawasCost = sawasLM * wasteFactor * sawasPrice;
            const glassCost = totalGlassArea * glassPrice;
            const bakitaCost = totalBakitaLM * wasteFactor * bakitaPrice;
            
            const accResult = calculateHingedAccessories(windowType, opType, doorCount, height);
            const accCost = accResult.total;
            
            let area = (width * height) / 10000; if (area < 1) area = 1;
            const totalCost = frameCost + sashCost + teeCost + sawasCost + glassCost + bakitaCost + accCost;
            const profit = profitPerM2 * area;
            const finalPrice = totalCost + profit;
            const pricePerMeter = finalPrice / area;
            
            document.getElementById('hingedFinalPrice').textContent = finalPrice.toFixed(2);
            document.getElementById('hingedPricePerMeter').textContent = '📐 ' + getText('سعر المتر:', 'Price/m²:') + ' ' + pricePerMeter.toFixed(2) + ' ' + getCurrency() + '/' + getText('م²', 'm²');
            document.getElementById('hingedBadgeArea').textContent = area.toFixed(2) + getText(' م²', ' m²');
            document.getElementById('hingedBadgeSystem').textContent = (isCraft ? getText('كرافت', 'Craft') : getText('كومبن', 'Kompen')) + ' | ' + (isColored ? getText('ألوان', 'Colored') : getText('أبيض', 'White'));
            
            const t = { lm: getText('م.ط', 'LM'), sqm: getText('م²', 'm²'), sar: getCurrency(), total: getText('إجمالي', 'Total'), cm: 'سم' };
            const profileName = currentLang === 'ar' ? profile.name : profile.nameEn;
            const systemLabel = isCraft ? '🔷 ' + getText('كرافت', 'Craft') : '✅ ' + getText('كومبن', 'Kompen');
            const colorLabel = isColored ? '🎨 ' + getText('ألوان', 'Colored') : '⬜ ' + getText('أبيض', 'White');
            
            let html = `<div class="results-grid">
                <div class="result-box"><h3>🏗️ ${getText('مقاسات الحلق', 'Frame')}</h3>
                    <div class="result-item"><span class="result-label">${getText('العرض', 'Width')}</span><span class="result-value">${frameW.toFixed(1)} ${t.cm} × 2</span></div>
                    <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${frameH.toFixed(1)} ${t.cm} × 2</span></div>
                    <div class="summary-total">📏 ${t.total}: ${frameLM.toFixed(2)} ${t.lm} | ${frameCost.toFixed(2)} ${t.sar}</div>
                </div>
                <div class="result-box green"><h3>🚪 ${getText('مقاسات الضلفة', 'Sash')}</h3>
                    <div class="result-item"><span class="result-label">${getText('العرض', 'Width')}</span><span class="result-value">${sashW.toFixed(1)} ${t.cm} × ${doorCount * 2}</span></div>
                    <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${sashH.toFixed(1)} ${t.cm} × ${doorCount * 2}</span></div>
                    <div class="summary-total green">📏 ${t.total}: ${sashLM.toFixed(2)} ${t.lm} | ${sashCost.toFixed(2)} ${t.sar}</div>
                </div>`;
            
            if (teeLM > 0) {
                html += `<div class="result-box blue"><h3>🔗 ${getText('البوكلير', 'T-Profile')}</h3>
                    <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${teeH.toFixed(1)} ${t.cm}</span></div>
                    <div class="summary-total">📏 ${teeLM.toFixed(2)} ${t.lm} | ${teeCost.toFixed(2)} ${t.sar}</div>
                </div>`;
            }
            
            if (sawasDetails.length > 0) {
                html += `<div class="result-box orange"><h3>📐 ${getText('السؤاس', 'Mullion')}</h3>
                    ${sawasDetails.map(s => `<div class="result-item"><span class="result-label">${s.name}</span><span class="result-value">${s.val.toFixed(1)} ${t.cm}</span></div>`).join('')}
                    <div class="summary-total orange">📏 ${sawasLM.toFixed(2)} ${t.lm} | ${sawasCost.toFixed(2)} ${t.sar}</div>
                </div>`;
            }
            
            html += `<div class="result-box cyan"><h3>🔲 ${getText('الزجاج', 'Glass')}</h3>
                <div class="result-item"><span class="result-label">${getText('زجاج الضلفة', 'Sash Glass')}</span><span class="result-value">${glassW.toFixed(1)} × ${glassH.toFixed(1)} (×${doorCount})</span></div>
                ${fixedGlass.map(g => `<div class="result-item"><span class="result-label">${g.name}</span><span class="result-value">${g.w.toFixed(1)} × ${g.h.toFixed(1)}</span></div>`).join('')}
                <div class="summary-total">📐 ${t.total}: ${totalGlassArea.toFixed(4)} ${t.sqm} | ${glassCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            html += `<div class="result-box"><h3>📦 ${getText('الباكته', 'Bead')}</h3>
                <div class="result-item"><span class="result-label">${getText('باكته الضلفة', 'Sash Bead')}</span><span class="result-value">${bakitaW.toFixed(1)} × ${bakitaH.toFixed(1)} (×${doorCount})</span></div>
                ${fixedBakita.map(b => `<div class="result-item"><span class="result-label">${b.name}</span><span class="result-value">${b.w.toFixed(1)} × ${b.h.toFixed(1)}</span></div>`).join('')}
                <div class="summary-total">📏 ${t.total}: ${totalBakitaLM.toFixed(2)} ${t.lm} | ${bakitaCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            html += `<div class="result-box pink"><h3>🔧 ${getText('الإكسسوارات', 'Accessories')}</h3>
                ${accResult.items.map(i => `<div class="result-item"><span class="result-label">${i.name} (×${i.qty})</span><span class="result-value">${i.total.toFixed(2)} ${t.sar}</span></div>`).join('')}
                <div class="summary-total pink">💰 ${t.total}: ${accCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            html += `</div>
            <div class="result-box" style="margin-top:12px;background:linear-gradient(135deg,#1a1a2e,#2d2d44);color:white;border:none;">
                <h3 style="color:white;">💵 ${profileName} | ${systemLabel} | ${colorLabel}</h3>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('المساحة', 'Area')}</span><span class="result-value" style="color:var(--secondary);">${area.toFixed(2)} ${t.sqm}</span></div>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('إجمالي التكلفة', 'Total Cost')}</span><span class="result-value" style="color:white;">${totalCost.toFixed(2)} ${t.sar}</span></div>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('الربح', 'Profit')}</span><span class="result-value" style="color:var(--success);">${profit.toFixed(2)} ${t.sar}</span></div>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('سعر المتر المربع', 'Price per m²')}</span><span class="result-value" style="color:#00CEC9;">${pricePerMeter.toFixed(2)} ${t.sar}/${t.sqm}</span></div>
                <div class="result-item" style="border:none;"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('السعر النهائي', 'Final Price')}</span><span class="result-value" style="color:var(--warning);font-size:1.3em;">${finalPrice.toFixed(2)} ${t.sar}</span></div>
            </div>`;
            
            document.getElementById('hingedResults').innerHTML = html;
        }
        
        function calculateHingedAccessories(windowType, opType, doorCount, height) {
            let items = [], total = 0;
            
            if (windowType === 'باب') {
                const lockType = height <= 180 ? '160' : '180';
                const lockPrice = getVal('priceLock' + lockType);
                items.push({name: '🔐 ' + getText('سنترلوك', 'Lock') + ' ' + lockType, qty: 1, price: lockPrice, total: lockPrice});
                total += lockPrice;
                
                const handlePrice = getVal('priceDoorHandle');
                items.push({name: '🔑 ' + getText('مقبض باب', 'Door Handle'), qty: 1, price: handlePrice, total: handlePrice});
                total += handlePrice;
                
                const hingePrice = getVal('priceHinge');
                items.push({name: '🔩 ' + getText('مفصلة', 'Hinge'), qty: 4, price: hingePrice, total: hingePrice * 4});
                total += hingePrice * 4;
            } else {
                const esp = getESP(height);
                const espPrice = getVal('priceESP' + esp.size);
                items.push({name: '📏 ' + getText('سبالونة', 'ESP') + ' ' + esp.size, qty: doorCount, price: espPrice, total: espPrice * doorCount});
                total += espPrice * doorCount;
                
                const strikerPrice = getVal('priceStriker');
                items.push({name: '🔩 ' + getText('سكاك', 'Striker'), qty: esp.hooks, price: strikerPrice, total: strikerPrice * esp.hooks});
                total += strikerPrice * esp.hooks;
                
                const handlePrice = getVal('priceWinHandle');
                items.push({name: '🔑 ' + getText('مقبض شباك', 'Win Handle'), qty: 1, price: handlePrice, total: handlePrice});
                total += handlePrice;
                
                const hingeCount = height <= 120 ? 2 : height <= 200 ? 3 : 4;
                const hingePrice = getVal('priceHinge');
                items.push({name: '🔩 ' + getText('مفصلة', 'Hinge'), qty: hingeCount * doorCount, price: hingePrice, total: hingePrice * hingeCount * doorCount});
                total += hingePrice * hingeCount * doorCount;
                
                if (opType === 'قلاب') {
                    const tiltPrice = getVal('priceTiltArm');
                    items.push({name: '💪 ' + getText('ذراع قلاب', 'Tilt Arm'), qty: 1, price: tiltPrice, total: tiltPrice});
                    total += tiltPrice;
                }
                
                if (doorCount === 2) {
                    const shootPrice = getVal('priceShootbolt');
                    items.push({name: '🔒 ' + getText('ترباس', 'Shootbolt'), qty: 2, price: shootPrice, total: shootPrice * 2});
                    total += shootPrice * 2;
                }
                
                if (doorCount === 2 || opType === 'ثابت+مفصلي') {
                    const capPrice = getVal('priceMullionCap');
                    items.push({name: '🧢 ' + getText('نهاية قائم', 'Cap'), qty: 2, price: capPrice, total: capPrice * 2});
                    total += capPrice * 2;
                }
            }
            
            return {items, total};
        }
        
        // ==================== حساب السحاب ====================
        function calculateSliding() {
            const width = getVal('slidingWidth'), height = getVal('slidingHeight');
            const color = document.getElementById('slidingColor').value;
            const system = document.getElementById('slidingSystem').value;
            const frameType = document.getElementById('slidingFrameType').value;
            const windowType = document.getElementById('slidingWindowType').value;
            const doorCount = parseInt(document.getElementById('slidingDoorCount').value);
            const withMesh = document.getElementById('slidingWithMesh').checked;
            const withRoller = document.getElementById('slidingWithRoller').checked;
            const extras = getVal('slidingExtras');
            
            const isColored = color === 'colored';
            const colorSuffix = isColored ? 'C' : 'W';
            const isKompen = system === 'kompen';
            const profile = SLIDING_PROFILES[system];
            const prefix = isKompen ? 'Kompen' : 'Craft';
            
            const framePrice = frameType === 'withBar' ? getVal('slidingFrameBar' + prefix + colorSuffix) : getVal('slidingFrame' + prefix + colorSuffix);
            
            let sashPrice;
            if (isKompen) {
                sashPrice = windowType === 'باب' ? getVal('slidingDoor' + prefix + colorSuffix) : getVal('slidingSash' + prefix + colorSuffix);
            } else {
                sashPrice = getVal('slidingSash' + prefix + colorSuffix);
            }
            
            const meshPrice = getVal('slidingMesh' + prefix + colorSuffix);
            const trackPrice = getVal('slidingTrack' + prefix + colorSuffix);
            
            let tobbaPrice;
            if (isKompen) {
                tobbaPrice = windowType === 'باب' ? getVal('slidingTobbaLarge' + prefix + colorSuffix) : getVal('slidingTobbaSmall' + prefix + colorSuffix);
            } else {
                tobbaPrice = getVal('slidingTobba' + prefix + colorSuffix);
            }
            
            const interlockPrice = getVal('slidingInterlock' + prefix + colorSuffix);
            const bakitaPrice = getVal('slidingBakita' + prefix + colorSuffix);
            const glassPrice = getVal('priceGlass');
            const wastePercent = getVal('wastePercent');
            const profitPerM2 = getVal('profitPerM2');
            const wasteFactor = 1 + (wastePercent / 100);
            
            const frameAddition = profile[frameType].frameAddition;
            const frameW = width + frameAddition;
            const frameH = height + frameAddition;
            const frameLM = ((frameW * 2) + (frameH * 2)) / 100;
            
            let sashW, sashH, meshW, meshH;
            if (isKompen) {
                const sashKey = doorCount === 2 ? (windowType === 'باب' ? 'sash2Door' : 'sash2Window') : (windowType === 'باب' ? 'sash4Door' : 'sash4Window');
                const meshKey = doorCount === 2 ? (windowType === 'باب' ? 'mesh2Door' : 'mesh2Window') : (windowType === 'باب' ? 'mesh4Door' : 'mesh4Window');
                sashW = profile[sashKey].widthFormula(width);
                sashH = height - profile[sashKey].heightDiscount;
                meshW = profile[meshKey].widthFormula(width);
                meshH = height - profile[meshKey].heightDiscount;
            } else {
                sashW = profile.sash.widthFormula(width);
                sashH = height - profile.sash.heightDiscount;
                meshW = profile.mesh.widthFormula(width);
                meshH = height - profile.mesh.heightDiscount;
            }
            
            const sashLM = ((sashW * 2 + sashH * 2) * doorCount) / 100;
            const meshLM = withMesh ? ((meshW * 2 + meshH * 2)) / 100 : 0;
            
            const glassDiscount = isKompen ? (windowType === 'باب' ? profile.glassDiscountDoor : profile.glassDiscountWindow) : profile.glassDiscount;
            const glassW = sashW - glassDiscount;
            const glassH = sashH - glassDiscount;
            const glassArea = (glassW * glassH * doorCount) / 10000;
            
            const bakitaW = glassW + profile.bakitaAddition;
            const bakitaH = glassH + profile.bakitaAddition;
            const bakitaLM = (((bakitaW + bakitaH) * 2) * doorCount) / 100;
            
            const trackLength = width - profile.trackDiscount;
            const trackLM = (trackLength * 2) / 100;
            
            const tobbaCount = doorCount;
            const tobbaLM = (sashH * tobbaCount) / 100;
            
            const interlockLM = doorCount === 4 ? (sashH / 100) : 0;
            
            const frameCost = frameLM * wasteFactor * framePrice;
            const sashCost = sashLM * wasteFactor * sashPrice;
            const meshCost = meshLM * wasteFactor * meshPrice;
            const glassCost = glassArea * glassPrice;
            const bakitaCost = bakitaLM * wasteFactor * bakitaPrice;
            const trackCost = trackLM * wasteFactor * trackPrice;
            const tobbaCost = tobbaLM * wasteFactor * tobbaPrice;
            const interlockCost = interlockLM * wasteFactor * interlockPrice;
            
            const accResult = calculateSlidingAccessories(windowType, doorCount, height, withRoller);
            const accCost = accResult.total;
            
            let area = (width * height) / 10000; if (area < 1) area = 1;
            const extrasCost = extras * area;
            const totalCost = frameCost + sashCost + meshCost + glassCost + bakitaCost + trackCost + tobbaCost + interlockCost + accCost + extrasCost;
            const profit = profitPerM2 * area;
            const finalPrice = totalCost + profit;
            const pricePerMeter = finalPrice / area;
            
            document.getElementById('slidingFinalPrice').textContent = finalPrice.toFixed(2);
            document.getElementById('slidingPricePerMeter').textContent = '📐 ' + getText('سعر المتر:', 'Price/m²:') + ' ' + pricePerMeter.toFixed(2) + ' ' + getCurrency() + '/' + getText('م²', 'm²');
            document.getElementById('slidingBadgeArea').textContent = area.toFixed(2) + getText(' م²', ' m²');
            document.getElementById('slidingBadgeSystem').textContent = (isKompen ? getText('كومبن', 'Kompen') : getText('كرافت', 'Craft')) + ' | ' + (isColored ? getText('ألوان', 'Colored') : getText('أبيض', 'White'));
            
            const t = { lm: getText('م.ط', 'LM'), sqm: getText('م²', 'm²'), sar: getCurrency(), total: getText('إجمالي', 'Total'), cm: 'سم' };
            const systemLabel = isKompen ? '✅ ' + getText('كومبن', 'Kompen') : '🔷 ' + getText('كرافت', 'Craft');
            const colorLabel = isColored ? '🎨 ' + getText('ألوان', 'Colored') : '⬜ ' + getText('أبيض', 'White');
            const frameLabel = frameType === 'withBar' ? getText('بالبار', 'With Bar') : getText('بدون بار', 'Without Bar');
            let tobbaTypeLabel = '';
            if (isKompen) tobbaTypeLabel = ' (' + (windowType === 'باب' ? getText('كبيرة', 'Large') : getText('صغيرة', 'Small')) + ')';
            
            let html = `<div class="results-grid">
                <div class="result-box"><h3>🏗️ ${getText('الحلق', 'Frame')} ${frameLabel}</h3>
                    <div class="result-item"><span class="result-label">${getText('العرض', 'Width')}</span><span class="result-value">${frameW.toFixed(1)} ${t.cm} × 2</span></div>
                    <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${frameH.toFixed(1)} ${t.cm} × 2</span></div>
                    <div class="summary-total">📏 ${frameLM.toFixed(2)} ${t.lm} | ${frameCost.toFixed(2)} ${t.sar}</div>
                </div>
                <div class="result-box green"><h3>🚪 ${getText('الضلفة', 'Sash')}</h3>
                    <div class="result-item"><span class="result-label">${getText('العرض', 'Width')}</span><span class="result-value">${sashW.toFixed(1)} ${t.cm} × ${doorCount * 2}</span></div>
                    <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${sashH.toFixed(1)} ${t.cm} × ${doorCount * 2}</span></div>
                    <div class="summary-total green">📏 ${sashLM.toFixed(2)} ${t.lm} | ${sashCost.toFixed(2)} ${t.sar}</div>
                </div>`;
            
            if (withMesh) {
                html += `<div class="result-box blue"><h3>🪟 ${getText('ضلفة السلك', 'Mesh')}</h3>
                    <div class="result-item"><span class="result-label">${getText('العرض', 'Width')}</span><span class="result-value">${meshW.toFixed(1)} ${t.cm}</span></div>
                    <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${meshH.toFixed(1)} ${t.cm}</span></div>
                    <div class="summary-total">📏 ${meshLM.toFixed(2)} ${t.lm} | ${meshCost.toFixed(2)} ${t.sar}</div>
                </div>`;
            }
                        html += `<div class="result-box"><h3>📏 ${getText('التراك', 'Track')}</h3>
                <div class="result-item"><span class="result-label">${getText('الطول', 'Length')}</span><span class="result-value">${trackLength.toFixed(1)} ${t.cm} × 2</span></div>
                <div class="summary-total">📏 ${trackLM.toFixed(2)} ${t.lm} | ${trackCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            html += `<div class="result-box orange"><h3>🔪 ${getText('الطبة/السكينة', 'Tobba')}${tobbaTypeLabel}</h3>
                <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${sashH.toFixed(1)} ${t.cm} × ${tobbaCount}</span></div>
                <div class="result-item"><span class="result-label">${getText('الإجمالي', 'Total')}</span><span class="result-value">${tobbaLM.toFixed(2)} ${t.lm}</span></div>
                <div class="summary-total orange">📏 ${tobbaLM.toFixed(2)} ${t.lm} | ${tobbaCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            if (doorCount === 4) {
                html += `<div class="result-box blue"><h3>🔗 ${getText('التقابل', 'Interlock')}</h3>
                    <div class="result-item"><span class="result-label">${getText('الارتفاع', 'Height')}</span><span class="result-value">${sashH.toFixed(1)} ${t.cm}</span></div>
                    <div class="summary-total">📏 ${interlockLM.toFixed(2)} ${t.lm} | ${interlockCost.toFixed(2)} ${t.sar}</div>
                </div>`;
            }
            
            html += `<div class="result-box cyan"><h3>🔲 ${getText('الزجاج', 'Glass')}</h3>
                <div class="result-item"><span class="result-label">${getText('القياس', 'Size')}</span><span class="result-value">${glassW.toFixed(1)} × ${glassH.toFixed(1)} (×${doorCount})</span></div>
                <div class="summary-total">📐 ${glassArea.toFixed(4)} ${t.sqm} | ${glassCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            html += `<div class="result-box"><h3>📦 ${getText('الباكته', 'Bead')}</h3>
                <div class="result-item"><span class="result-label">${getText('القياس', 'Size')}</span><span class="result-value">${bakitaW.toFixed(1)} × ${bakitaH.toFixed(1)} (×${doorCount})</span></div>
                <div class="summary-total">📏 ${bakitaLM.toFixed(2)} ${t.lm} | ${bakitaCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            html += `<div class="result-box pink"><h3>🔧 ${getText('الإكسسوارات', 'Accessories')}</h3>
                ${accResult.items.map(i => `<div class="result-item"><span class="result-label">${i.name} (×${i.qty})</span><span class="result-value">${i.total.toFixed(2)} ${t.sar}</span></div>`).join('')}
                <div class="summary-total pink">💰 ${t.total}: ${accCost.toFixed(2)} ${t.sar}</div>
            </div>`;
            
            if (extras > 0) {
                html += `<div class="result-box"><h3>➕ ${getText('الإضافات', 'Extras')}</h3>
                    <div class="result-item"><span class="result-label">${extras} ${t.sar} × ${area.toFixed(2)} ${t.sqm}</span><span class="result-value">${extrasCost.toFixed(2)} ${t.sar}</span></div>
                </div>`;
            }
            
            html += `</div>
            <div class="result-box" style="margin-top:12px;background:linear-gradient(135deg,#1a1a2e,#2d2d44);color:white;border:none;">
                <h3 style="color:white;">💵 ${getText('سحاب', 'Sliding')} ${doorCount} ${getText('ضلفة', 'Sash')} | ${systemLabel} | ${colorLabel}</h3>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('المساحة', 'Area')}</span><span class="result-value" style="color:var(--secondary);">${area.toFixed(2)} ${t.sqm}</span></div>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('إجمالي التكلفة', 'Total Cost')}</span><span class="result-value" style="color:white;">${totalCost.toFixed(2)} ${t.sar}</span></div>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('الربح', 'Profit')}</span><span class="result-value" style="color:var(--success);">${profit.toFixed(2)} ${t.sar}</span></div>
                <div class="result-item" style="border-color:rgba(255,255,255,0.1);"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('سعر المتر المربع', 'Price per m²')}</span><span class="result-value" style="color:#00CEC9;">${pricePerMeter.toFixed(2)} ${t.sar}/${t.sqm}</span></div>
                <div class="result-item" style="border:none;"><span class="result-label" style="color:rgba(255,255,255,0.7);">${getText('السعر النهائي', 'Final Price')}</span><span class="result-value" style="color:var(--warning);font-size:1.3em;">${finalPrice.toFixed(2)} ${t.sar}</span></div>
            </div>`;
            
            document.getElementById('slidingResults').innerHTML = html;
        }
        
        function calculateSlidingAccessories(windowType, doorCount, height, withRoller) {
            let items = [], total = 0;
            
            const esp = getESP(height);
            const espCount = doorCount === 2 ? 2 : 3;
            const espPrice = getVal('priceSlidingESP' + esp.size);
            items.push({name: '📏 ' + getText('سبالونة', 'ESP') + ' ' + esp.size, qty: espCount, price: espPrice, total: espPrice * espCount});
            total += espPrice * espCount;
            
            if (withRoller) {
                const rollerCount = doorCount === 2 ? 4 : 8;
                const rollerPrice = rollerType === 'double' ? getVal('priceRollerDouble') : getVal('priceRollerSingle');
                const rollerName = rollerType === 'double' ? '🔘 ' + getText('عجل دبل', 'Double Roller') : '🔘 ' + getText('عجل سنجل', 'Single Roller');
                items.push({name: rollerName, qty: rollerCount, price: rollerPrice, total: rollerPrice * rollerCount});
                total += rollerPrice * rollerCount;
            }
            
            const handleDPrice = getVal('priceHandleD');
            const handleFPrice = getVal('priceHandleFlush');
            items.push({name: '🔑 ' + getText('مقبض بارز', 'D-Handle'), qty: 1, price: handleDPrice, total: handleDPrice});
            total += handleDPrice;
            
            const flushCount = doorCount === 2 ? 1 : 2;
            items.push({name: '🔑 ' + getText('مقبض غاطس', 'Flush Handle'), qty: flushCount, price: handleFPrice, total: handleFPrice * flushCount});
            total += handleFPrice * flushCount;
            
            const antiLiftCount = doorCount === 2 ? 2 : 4;
            const antiLiftPrice = getVal('priceAntiLift');
            items.push({name: '🔒 ' + getText('مانع رفع', 'Anti-Lift'), qty: antiLiftCount, price: antiLiftPrice, total: antiLiftPrice * antiLiftCount});
            total += antiLiftPrice * antiLiftCount;
            
            return {items, total};
        }
        
        // ==================== التهيئة ====================
        window.onload = function() {
            loadTheme();
            loadPrices();
            loadFormData();
            loadLanguage();
            toggleRollerType();
            
            if (!localStorage.getItem('windooraFormDataSAR')) {
                calculateHinged();
            }
        };
    </script>
